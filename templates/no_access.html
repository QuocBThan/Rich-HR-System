<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không có quyền truy cập</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align: center;
    }
    .icon-wrap {
      width: 64px; height: 64px;
      background: #fef2f2;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    h4 { font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    p  { color: #64748b; font-size: .88rem; line-height: 1.6; }
    .user-pill {
      display: inline-block;
      background: #f1f5f9;
      border-radius: 99px;
      padding: 4px 14px;
      font-size: .8rem;
      color: #475569;
      margin-bottom: 24px;
    }
    .btn-logout {
      background: #3b82f6; color: #fff; border: none;
      border-radius: 8px; padding: 10px 24px;
      font-weight: 600; font-size: .9rem; text-decoration: none;
      display: inline-block; transition: .15s;
    }
    .btn-logout:hover { background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <i class="bi bi-shield-lock" style="font-size:1.8rem;color:#ef4444"></i>
    </div>
    <h4>Không có quyền truy cập</h4>
    <p>Tài khoản của bạn không có quyền truy cập vào tính năng này.</p>

    {% if current_user %}
    <div class="user-pill">
      <i class="bi bi-person me-1"></i>{{ current_user }}
      <span style="color:#94a3b8;margin-left:4px">· {{ current_role }}</span>
    </div>
    {% endif %}

    <br>
    <a href="{{ url_for('logout') }}" class="btn-logout">
      <i class="bi bi-box-arrow-right me-1"></i>Đăng Xuất
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
