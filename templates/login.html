<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập — RichHR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #2684FF;
      --blue-d:  #0D47D9;
      --indigo:  #2684FF;
      --ink:     #0A1A45;
      --ink-mid: #0F2156;
      --muted:   #64748b;
      --border:  #e2e8f0;
      --surface: #f8fafc;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Background ──────────────────────────── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(38,132,255,.15) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 90%, rgba(13,71,217,.12) 0%, transparent 60%),
                  var(--ink);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; opacity: .04;
      background-image:
        linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* ── Card ────────────────────────────────── */
    .card-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      margin: 24px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.06),
        0 32px 80px rgba(0,0,0,.55),
        0 8px 24px rgba(0,0,0,.35);
      animation: cardIn .45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(28px) scale(.97); }
      to   { opacity:1; transform: translateY(0)    scale(1);   }
    }

    /* ── Brand header ────────────────────────── */
    .brand-header {
      background: var(--ink-mid);
      padding: 36px 40px 32px;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .brand-header::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 100% 120% at 50% -20%, rgba(38,132,255,.2), transparent 65%);
      pointer-events: none;
    }

    .logo-mark {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2684FF 0%, #0D47D9 100%);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(38,132,255,.45), 0 0 0 1px rgba(255,255,255,.12);
      position: relative; z-index: 1;
    }
    .logo-mark svg { width: 28px; height: 28px; }

    .brand-name {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -.4px;
      color: #f1f5f9;
      line-height: 1;
      position: relative; z-index: 1;
    }
    .brand-name span { color: #7ab8ff; }

    .brand-sub {
      font-size: .78rem;
      color: #475569;
      margin-top: 6px;
      letter-spacing: .3px;
      position: relative; z-index: 1;
    }

    /* ── Form panel ──────────────────────────── */
    .form-panel {
      background: #fff;
      padding: 36px 40px 32px;
    }

    .field-group { margin-bottom: 18px; }

    .field-label {
      display: block;
      font-size: .75rem;
      font-weight: 700;
      color: #374151;
      letter-spacing: .3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .field-wrap {
      position: relative;
    }
    .field-wrap .field-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: #94a3b8; font-size: .95rem;
      pointer-events: none;
      transition: color .2s;
    }
    .field-wrap input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .9rem;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .field-wrap input:focus {
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 3.5px rgba(59,130,246,.14);
    }
    .field-wrap input:focus + .field-icon,
    .field-wrap:has(input:focus) .field-icon {
      color: var(--blue);
    }
    .field-wrap .field-icon { z-index: 1; }

    /* password toggle */
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #94a3b8; font-size: .95rem; padding: 2px;
      transition: color .15s;
      z-index: 2;
    }
    .pw-toggle:hover { color: var(--muted); }

    /* ── Error ───────────────────────────────── */
    .error-bar {
      display: flex; align-items: center; gap: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 9px;
      padding: 10px 14px;
      color: #b91c1c;
      font-size: .82rem;
      margin-bottom: 18px;
      animation: shake .4s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-5px); }
      40%      { transform: translateX(5px); }
      60%      { transform: translateX(-3px); }
      80%      { transform: translateX(3px); }
    }

    /* ── Button ──────────────────────────────── */
    .btn-login {
      position: relative; overflow: hidden;
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #2684FF 0%, #0D47D9 100%);
      border: none; border-radius: 10px;
      color: #fff;
      font-size: .92rem; font-weight: 700;
      letter-spacing: .2px;
      cursor: pointer;
      transition: opacity .15s, transform .12s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(38,132,255,.35);
      margin-top: 6px;
    }
    .btn-login:hover {
      opacity: .93;
      box-shadow: 0 6px 22px rgba(38,132,255,.45);
    }
    .btn-login:active { transform: scale(.98); }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      transform: scale(0);
      animation: ripple-anim .55s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }

    /* ── Footer hint ─────────────────────────── */
    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: .75rem;
      color: #94a3b8;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }

    /* ── Cursor click ripple ─────────────────── */
    .cursor-ripple {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      width: 10px; height: 10px;
      border: 2px solid rgba(38,132,255,.6);
      transform: translate(-50%, -50%) scale(1);
      animation: cursor-bloom .55s ease-out forwards;
    }
    @keyframes cursor-bloom {
      to { transform: translate(-50%, -50%) scale(7); opacity: 0; }
    }

    /* ── Loading spinner on submit ───────────── */
    .btn-login .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .card-wrap { animation: none; }
      .cursor-ripple, .ripple { animation: none; }
      .error-bar { animation: none; }
    }
  </style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="bg-grid"></div>

<div class="card-wrap">

  <!-- Brand header -->
  <div class="brand-header">
    <div class="logo-mark">
      <svg viewBox="0 0 26 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M0 0 H17 Q26 0 26 8 Q26 16 17 16 L25 30 H20 L12 16 H5 V30 H0 Z
             M5 4 H15 Q21 4 21 8 Q21 12 15 12 H5 Z"
          fill="white"/>
      </svg>
    </div>
    <div class="brand-name">Rich<span>HR</span></div>
    <div class="brand-sub">Attendance &amp; Leave · Rich Payment Solutions</div>
  </div>

  <!-- Form panel -->
  <div class="form-panel">

    {% if error %}
    <div class="error-bar">
      <i class="bi bi-exclamation-circle-fill"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST"
          action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}"
          id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field-group">
        <label class="field-label" for="username">Tài khoản</label>
        <div class="field-wrap">
          <input type="text" id="username" name="username"
                 placeholder="username"
                 autofocus autocomplete="username" required>
          <i class="bi bi-person field-icon"></i>
        </div>
      </div>

      <div class="field-group">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <label class="field-label" for="password" style="margin-bottom:0">Mật khẩu</label>
          <a href="{{ url_for('forgot_password') }}"
             style="font-size:.75rem;font-weight:600;color:#2684FF;text-decoration:none;letter-spacing:.1px;transition:color .15s,opacity .15s;opacity:.85"
             onmouseover="this.style.opacity='1';this.style.color='#0D47D9'"
             onmouseout="this.style.opacity='.85';this.style.color='#2684FF'">
            <i class="bi bi-key-fill" style="font-size:.72rem;margin-right:3px"></i>Quên mật khẩu?
          </a>
        </div>
        <div class="field-wrap">
          <input type="password" id="password" name="password"
                 placeholder="••••••••"
                 autocomplete="current-password" required>
          <i class="bi bi-lock field-icon"></i>
          <button type="button" class="pw-toggle" id="pwToggle" title="Hiện/ẩn mật khẩu">
            <i class="bi bi-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="spinner" id="spinner"></span>
        <i class="bi bi-box-arrow-in-right" id="btnIcon"></i>
        <span id="btnText"> &nbsp;Đăng Nhập</span>
      </button>
    </form>

    <div class="hint" style="margin-top:20px">
      <i class="bi bi-shield-lock"></i>
      Hệ thống nội bộ — chỉ dành cho nhân viên được cấp quyền
    </div>
  </div>
</div>

<script>
// ── Password toggle ──────────────────────────────────────
const pwToggle = document.getElementById('pwToggle');
const pwInput  = document.getElementById('password');
const pwIcon   = document.getElementById('pwIcon');
pwToggle.addEventListener('click', function () {
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  pwIcon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
});

// ── Button ripple ────────────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', function (e) {
  const btn = this;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x    = e.clientX - rect.left - size / 2;
  const y    = e.clientY - rect.top  - size / 2;

  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.cssText =
    `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});

// ── Submit loading state ─────────────────────────────────
document.getElementById('loginForm').addEventListener('submit', function () {
  const btn     = document.getElementById('loginBtn');
  const spinner = document.getElementById('spinner');
  const icon    = document.getElementById('btnIcon');
  const text    = document.getElementById('btnText');
  btn.disabled      = true;
  spinner.style.display = 'inline-block';
  icon.style.display    = 'none';
  text.textContent      = ' Đang đăng nhập…';
});

// ── Page-wide cursor click effect ───────────────────────
document.addEventListener('click', function (e) {
  const el = document.createElement('div');
  el.className = 'cursor-ripple';
  el.style.left = e.clientX + 'px';
  el.style.top  = e.clientY + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
});
</script>
</body>
</html>
